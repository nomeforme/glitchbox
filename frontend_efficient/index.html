<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Streaming Client</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        video { border: 1px solid #ddd; border-radius: 4px; background-color: #000; }
        .status-bar { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; background-color: #007bff; color: white; }
        button:disabled { background-color: #ccc; }
        #serverIp { padding: 8px; border-radius: 4px; border: 1px solid #ddd; margin-right: 10px; }
        .video-container { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .video-wrapper { display: flex; flex-direction: column; align-items: center; }
        label { margin-top: 10px; margin-bottom: 5px; display: block; font-weight: bold; }
        textarea, input[type="text"], input[type="number"], select {
            width: calc(100% - 22px); /* Account for padding and border */
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        input[type="range"] { width: calc(100% - 80px); /* Space for value display */ margin-right: 10px;}
        .control-group { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 4px; }
        .control-group label { font-weight: bold; display: block; margin-bottom: 5px; }
        .control-group input[type="checkbox"] { margin-right: 5px; vertical-align: middle; }
        .control-group span { vertical-align: middle; } /* For range value display */
        #logs {
            background-color: #222; color: #0f0; font-family: monospace;
            height: 200px; overflow-y: scroll; border: 1px solid #444;
            padding: 10px; margin-top: 20px; border-radius: 4px; white-space: pre-wrap;
        }
    </style>
</head><body>
    <div class="container">
        <h1>Real-Time Streaming Client (Efficient)</h1>
        
        <div class="status-bar">
            <div>
                <label for="serverIp">Server IP:</label>
                <input type="text" id="serverIp" value="172.18.3.13">
                <button id="startButton">Start Stream</button>
                <button id="stopButton" disabled>Stop Stream</button>
            </div>
            <div>
                <span id="fpsCounter">FPS: --</span>
            </div>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <label>Webcam Feed (Input)</label>
                <video id="webcamFeed" width="320" height="240" autoplay playsinline muted></video>
            </div>
            <div class="video-wrapper">
                <label>Processed Stream (Output)</label>
                <video id="videoStream" width="512" height="512" autoplay playsinline></video>
                <button id="pipButton">Toggle Picture-in-Picture</button>
                <button id="fullscreenButton">Toggle Fullscreen</button>
                <button id="stopButton" disabled>Stop Stream</button>
            </div>
        </div>

        <div>
            <label for="promptInput">Prompt:</label>
            <textarea id="promptInput" rows="3">default prompt</textarea>
        </div>

        <div id="dynamicControlsContainer">
            <!-- Dynamically generated controls will appear here -->
        </div>
        
        <label for="logs">Logs:</label>
        <pre id="logs"></pre>
    </div>

    <script src="main.js"></script>
</body>
</html>
