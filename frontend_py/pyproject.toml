[project]
name = "client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11.15",
    "colored>=2.3.0",
    "ctranslate2>=4.5.0",
    "fastapi[standard]>=0.110.3",
    "nvidia-cudnn-cu12>=9.1.0",
    "markdown2>=2.5.3",
    "ninja>=1.11.1.3",
    "opencv-python>=4.11.0.86",
    "pyaudio>=0.2.14",
    "pygame>=2.6.1",
    "pyqt6==6.6.1",
    "pyqt6-qt6==6.6.1",
    "pyqt6-sip==13.6.0",
    "pyrealsense2>=2.56.5.9235",
    "pyside6==6.6.1",
    "python-dotenv>=1.1.0",
    "python-multipart==0.0.6",
    "pyvirtualcam>=0.14.0",
    "pyzmq>=26.4.0",
    "realtimestt==0.3.98",
    "requests>=2.32.3",
    "scipy==1.15.1",
    "sounddevice>=0.5.1",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "uvicorn==0.24.0",
    "uvloop>=0.21.0",
    "websockets==14.2",
]

[tool.uv.workspace]
members = ["server"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
]
xformers = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
